name: "Build Go image"
description: "Download Go (latest|unstable) then build"
inputs:
    version:
        description: "latest | unstable"
        required: true
    dockerfile:
        description: "Path to Dockerfile"
        required: true
    tags:
        description: "Tags to apply (one per line)"
        required: true
    no_cache:
        description: "Use --no-cache"
        required: false
        default: "false"
    arch:
        description: "Target architecture (amd64 or arm64)"
        required: true
    version_image:
        description: "Image name (e.g., ghcr.io/valksor/go); when set, also tags it as <image>:<go_version>-<arch>"
        required: false
        default: ""
outputs:
    go_version:
        description: "Resolved Go version"
        value: ${{ steps.download.outputs.go_version }}
runs:
    using: "composite"
    steps:
        -   id: download
            uses: ./.github/actions/download-go
            with:
                version: ${{ inputs.version }}
                arch: ${{ inputs.arch }}

        -   uses: ./.github/actions/build-simple
            with:
                dockerfile: ${{ inputs.dockerfile }}
                tags: |
                    ${{ inputs.tags }}
                    ${{ inputs.version_image != '' && format('{0}:{1}-{2}', inputs.version_image, steps.download.outputs.go_version, inputs.arch) || '' }}
                arch: ${{ inputs.arch }}
                build-args: |
                    GO_VERSION=${{ steps.download.outputs.go_version }}
                    GO_ROOT=go-root-${{ inputs.version }}
                    CACHE_BUSTER=${{ github.run_id }}
                no_cache: ${{ inputs.no_cache }}

name: "Create multi-arch manifest"
description: "Combine -amd64 and -arm64 arch-suffixed tags into a single multi-arch manifest"
inputs:
    image:
        description: "Image name (e.g., ghcr.io/valksor/debian)"
        required: true
    tag:
        description: "Target tag (e.g., latest). The per-arch source must already exist as ${image}:${tag}-arm64, plus ${image}:${tag}-amd64 unless skip_amd64 is 'true'."
        required: true
    skip_amd64:
        description: "When 'true', create the manifest from the arm64 image only"
        required: false
        default: "false"
runs:
    using: "composite"
    steps:
        -   name: Create manifest
            shell: bash
            env:
                INPUT_IMAGE: ${{ inputs.image }}
                INPUT_TAG: ${{ inputs.tag }}
                INPUT_SKIP_AMD64: ${{ inputs.skip_amd64 }}
            run: |
                set -euo pipefail
                ref="${INPUT_IMAGE}:${INPUT_TAG}"
                sources=("${ref}-arm64")
                if [[ "${INPUT_SKIP_AMD64}" != "true" ]]; then
                    sources+=("${ref}-amd64")
                else
                    echo "::warning::Pushing arm64-only manifest for ${ref}; amd64 pulls will fail until the next full multi-arch build"
                    echo "⚠️ \`${ref}\` pushed as **arm64-only**" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
                fi
                echo "::group::Creating manifest for ${ref}"
                docker manifest rm "${ref}" 2>/dev/null || true
                docker manifest create "${ref}" "${sources[@]}"
                docker manifest push "${ref}"
                echo "::endgroup::"

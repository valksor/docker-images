name: 'Download Go'
description: 'Download Go version (latest or unstable)'
inputs:
    version:
        description: 'Go version to download (latest or unstable)'
        required: true
    arch:
        description: 'Architecture (amd64 or arm64)'
        required: true
outputs:
    go_version:
        description: 'Downloaded Go version'
        value: ${{ steps.download.outputs.GO_VERSION }}
runs:
    using: 'composite'
    steps:
        -   id: download
            shell: bash
            run: |
                set -eux
                if [ "${{ inputs.version }}" = "latest" ]; then
                    set +x
                    JSON=$(curl -s 'https://go.dev/dl/?mode=json')
                    GO_VERSION=$(echo "$JSON" | grep '"version"' | head -1 | cut -d'"' -f4 | sed 's/^go//')
                    FILENAME=$(echo "$JSON" | grep "\"filename\".*linux-${{ inputs.arch }}.*tar.gz" | head -1 | cut -d'"' -f4)
                    set -x
                else
                    set +x
                    JSON=$(curl -s 'https://go.dev/dl/?mode=json&include=all')
                    GO_VERSION=$(echo "$JSON" | grep -A10 '"stable": false' | grep '"version"' | head -1 | cut -d'"' -f4 | sed 's/^go//')
                    FILENAME=$(echo "$JSON" | grep "\"filename\".*linux-${{ inputs.arch }}.*tar.gz" | grep -E "(beta|rc)" | head -1 | cut -d'"' -f4)
                    set -x
                fi
                echo "GO_VERSION=$GO_VERSION" >> $GITHUB_OUTPUT

                # Expected checksum, published alongside the file in the same json.
                SHA256=$(echo "$JSON" | grep -F -A6 "\"${FILENAME}\"" | grep '"sha256"' | head -1 | cut -d'"' -f4)
                [ -n "$FILENAME" ] || { echo "Could not determine Go tarball filename"; exit 1; }
                [ -n "$SHA256" ] || { echo "Could not determine sha256 for ${FILENAME}"; exit 1; }

                URL="https://go.dev/dl/${FILENAME}"

                ROOT="go-root-${{ inputs.version }}"
                CURL_OPTS="--connect-timeout 15 --speed-limit 102400 --speed-time 30 --retry 2"
                mkdir -p "$ROOT"

                # dl.google.com (where go.dev/dl redirects) is unreachable from some runners:
                # the handshake completes but no body arrives. Fail fast, then fall back to
                # the Go module proxy toolchain zip, verified against the Go checksum database.
                if curl -fSL $CURL_OPTS "$URL" -o /tmp/go.tar.gz \
                    && echo "${SHA256}  /tmp/go.tar.gz" | sha256sum -c -; then
                    tar -xzf /tmp/go.tar.gz -C "$ROOT"
                    echo "Go ${GO_VERSION} installed from go.dev tarball"
                else
                    MODULE="golang.org/toolchain"
                    MODVER="v0.0.1-go${GO_VERSION}.linux-${{ inputs.arch }}"
                    curl -fSL $CURL_OPTS "https://proxy.golang.org/${MODULE}/@v/${MODVER}.zip" -o /tmp/go.zip
                    H1=$(curl -fsSL $CURL_OPTS "https://sum.golang.org/lookup/${MODULE}@${MODVER}" \
                        | awk -v m="$MODULE" -v v="$MODVER" '$1 == m && $2 == v { print $3 }')
                    [ -n "$H1" ] || { echo "Could not determine checksum database hash for ${MODVER}"; exit 1; }
                    python3 -I - /tmp/go.zip "$H1" "$ROOT/go" "${MODULE}@${MODVER}/" <<'PY'
                import base64, hashlib, os, sys, zipfile

                path, expected, dest, prefix = sys.argv[1:]
                with zipfile.ZipFile(path) as z:
                    infos = sorted((i for i in z.infolist() if not i.is_dir()), key=lambda i: i.filename)
                    lines = b"".join(
                        hashlib.sha256(z.read(i)).hexdigest().encode() + b"  " + i.filename.encode() + b"\n"
                        for i in infos
                    )
                    actual = "h1:" + base64.b64encode(hashlib.sha256(lines).digest()).decode()
                    if actual != expected:
                        sys.exit(f"checksum mismatch: got {actual}, want {expected}")
                    for i in infos:
                        if not i.filename.startswith(prefix) or ".." in i.filename.split("/"):
                            sys.exit(f"unexpected zip entry: {i.filename}")
                        target = os.path.join(dest, i.filename[len(prefix):])
                        os.makedirs(os.path.dirname(target), exist_ok=True)
                        with open(target, "wb") as f:
                            f.write(z.read(i))
                        os.chmod(target, ((i.external_attr >> 16) & 0o777) or 0o644)
                print("verified " + actual)
                PY
                    echo "Go ${GO_VERSION} installed from Go module proxy (verified against sum.golang.org)"
                fi
                rm -f /tmp/go.tar.gz /tmp/go.zip
